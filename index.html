<title>My Little Suitcase · 我的旅行手帐</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:light;font-family:ui-rounded,"PingFang SC",system-ui,sans-serif;color:#674d40;background:#faf2e9}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:10px;background:radial-gradient(ellipse at 5% 12%,#f6dfd7,transparent 57%),radial-gradient(ellipse at 100% 90%,#f3ddd2,transparent 64%),#fbf4ea}
main{width:min(100%,1536px,calc((100svh - 20px)*1.5))}
.stage{position:relative;aspect-ratio:3/2;isolation:isolate;overflow:hidden;border-radius:12px;box-shadow:0 7px 32px #6e41381c;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.scene,.layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.scene{display:block}
.hotspot{position:absolute;border:0;border-radius:50%;padding:0;background:transparent;touch-action:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
#enter{left:15.3%;top:62.3%;width:33.2%;height:10.3%;border-radius:60px;touch-action:manipulation}
#enter:hover{background:rgba(255,248,234,.14);box-shadow:0 0 0 2px #bb715c66}
button:focus-visible{outline:3px dashed #86452e;outline-offset:3px}
footer{min-height:40px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 5px 0;font-size:clamp(11px,1.2vw,13px);letter-spacing:.04em}
#back{position:absolute;left:8.6%;top:14.7%;transform:translate(-50%,-50%);width:7.4%;height:8.3%;min-width:44px;min-height:44px;border:0;border-radius:35%;padding:0;display:grid;place-items:center;background:transparent;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#back svg{width:96%;height:85%;overflow:visible;filter:drop-shadow(0 2px 1px #69463655);transition:transform .14s ease-out}
#back:hover svg{transform:translateX(-3%) rotate(-3deg)}
#back:active svg{transform:scale(.93)}
@media(prefers-reduced-motion:reduce){#back svg{transition:none}#back:hover svg,#back:active svg{transform:none}}
[hidden]{display:none!important}
@media(max-width:600px){body{padding:5px}.stage{border-radius:8px}footer{min-height:46px}}
.stage{container-type:inline-size}
#back,.music-key{z-index:5}
#back{left:12.6%;top:16.1%;width:6.5%;height:7.4%;min-width:0;min-height:0}
#back::before,.music-key::before{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
.music-key{position:absolute;right:4.5%;bottom:5%;width:6%;height:8%;display:grid;place-items:center;border:0;padding:0;border-radius:40%;color:#9e6652;background:none;cursor:pointer;touch-action:manipulation}
[data-page="menu"] .music-key{right:10.35%;bottom:11.35%;width:4.15%;height:5.4%}
#doll-invitation{position:absolute;left:47.65%;bottom:57.1%;transform:rotate(-2deg);transform-origin:bottom left;padding:.48em .83em;background:#fff6e5;border:1.5px solid #b97f70;border-radius:1em 1.1em 1em .65em;box-shadow:.05em .16em #d39d8b8c;color:#78473b;font:600 clamp(10px,1.4cqw,22px)/1.3 ui-rounded,"PingFang SC",sans-serif;white-space:nowrap;pointer-events:none;z-index:3;animation:invite-breathe 5s both}
#doll-invitation::after{content:"";position:absolute;left:6%;bottom:-.34em;width:.55em;height:.55em;background:#fff6e5;border-right:1.5px solid #b97f70;border-bottom:1.5px solid #b97f70;transform:skew(-16deg,-8deg) rotate(45deg)}
[data-page="welcome"] #doll-invitation{left:auto;right:29.7%;bottom:70.5%;transform-origin:bottom right}
[data-page="welcome"] #doll-invitation::after{left:auto;right:12%}
@keyframes invite-breathe{0%{opacity:0;translate:0 .22em}17%,78%{opacity:1;translate:0 0}100%{opacity:0;translate:0 -.16em}}
@media(prefers-reduced-motion:reduce){#doll-invitation{animation-name:invite-opacity}@keyframes invite-opacity{0%,100%{opacity:0}17%,78%{opacity:1}}}
.music-key svg{width:100%;height:100%;filter:drop-shadow(0 2px 1px #8d594952)}
.music-key[data-playing=true] svg{filter:drop-shadow(0 0 3px #fff2b9) drop-shadow(0 2px 2px #866749)}
.illustrated{background-repeat:no-repeat;background-color:transparent;border:0;padding:0;display:block}
.portal{position:absolute;cursor:pointer;touch-action:manipulation;transition:transform 150ms ease-out,filter 150ms;z-index:2}
.portal:is(:hover,:focus-visible){transform:scale(1.027);filter:brightness(1.055)}
.portal:focus-visible{filter:brightness(1.15) saturate(1.25)}
.music-box h2{font-family:"Baskerville","Palatino Linotype",Georgia,serif;font-weight:500;letter-spacing:-.04em;margin:0}
.stage[data-detail=true] #back{left:12.3%;top:17.6%}
.music-box{--ink:#684535;position:fixed;inset:auto;left:var(--box-x,50%);top:var(--box-y,50%);transform:translate(-50%,-50%);margin:0;width:clamp(250px,var(--box-width,38vw),520px);max-width:calc(100vw - 22px);max-height:min(90dvh,510px);padding:clamp(14px,2vw,27px);border:2px solid #bd8c75;border-radius:17px 20px 18px 20px;color:var(--ink);box-shadow:0 3px 0 #d69c84,0 12px 38px #57372c45;background:radial-gradient(ellipse at 97% 0%,#f5caba9c,transparent 65%),linear-gradient(150deg,#fff8e9,#fceedc);overflow:hidden}
.music-box[open]{display:flex;flex-direction:column;gap:clamp(6px,1vw,13px)}
.music-box::before{content:"";position:absolute;inset:6px;border:1px dashed #d9ad93;border-radius:12px;pointer-events:none}
.music-box::backdrop{background:#49362638}
.music-box header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.music-box h2{font-size:clamp(23px,3.2vw,40px);font-style:italic;line-height:1.15}
.music-box button{font:inherit;color:inherit;cursor:pointer}
#music-close{width:34px;height:34px;background:#f6dacb;border:1px solid #d9b29b;border-radius:50%;line-height:1;font-size:23px;display:grid;place-items:center}
.track-list{display:grid;gap:4px;overflow-y:auto;max-height:clamp(114px,19vw,216px);min-height:0}
.track-row{display:flex;align-items:center;gap:10px;border:none;border-bottom:1px solid #dfc6af;padding:clamp(5px,1vw,10px) 3px;text-align:left;background:transparent;min-width:0}
.track-row:is(:hover,:focus-visible),.track-row[aria-pressed=true]{background:#f3d6c351;border-radius:7px}
.track-row:focus-visible{outline-offset:-3px}
.track-row .play{border-radius:50%;width:clamp(20px,2.6vw,31px);aspect-ratio:1;background:#f1c5b2;display:grid;place-items:center;color:#834d3b;flex:none;font:12px system-ui}
.track-name{font-size:clamp(12px,1.4vw,17px);font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.track-time{margin-left:auto;color:#866650;font:clamp(10px,1.1vw,13px) ui-monospace,monospace}
#add-track{padding:7px 9px;border:1px dashed #bd947c;border-radius:9px;background:#fff7e657;text-align:center;font-size:clamp(12px,1.2vw,15px)}
#music-message{margin:0;font-size:12px}
@media(max-width:600px){.music-box{padding:13px 15px}.music-box[open]{gap:6px}.track-list{max-height:120px}.track-row{min-height:34px;padding:4px}.music-box h2{font-size:23px}#music-close{height:30px;width:30px}}
@media(prefers-reduced-motion:reduce){.portal{transition:none}.portal:hover,.portal:focus-visible{transform:none}}

.visually-hidden{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.resume-paper{position:absolute;inset:9.7% 4.3% 9.8%;background:#fff8eb;color:#52392e;border:1px solid #ba967d;border-radius:3.8% / 5.5%;box-shadow:0 4px 0 #cc9b84,0 5px 18px #673e302c;display:flex;flex-direction:column;overflow:hidden;user-select:text;-webkit-user-select:text}
.resume-bar{height:14%;min-height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 5% 0 17%;border-bottom:1px solid #e4cbb3;background:linear-gradient(95deg,#f8d8c9,#fff5e4 74%);font:italic 500 clamp(20px,3cqw,42px)/1 Baskerville,Georgia,serif}
.pdf-link{font:500 clamp(10px,1.08cqw,15px)/1.3 system-ui,sans-serif;color:#754a3c;text-decoration:none;border:1px solid #cfa78e;border-radius:30px;padding:.5em .85em;background:#fff4e5}
.resume-body{flex:1;min-height:0;display:grid;grid-template-columns:19.5% 1fr}
#resume-nav{min-height:0;overflow:auto;padding:18% 10% 8% 18%;display:flex;flex-direction:column;gap:.4em;border-right:1px dashed #d6b69b;background:#f5dfc936}
#resume-nav button{font-weight:500;line-height:1.45;font-family:inherit;font-size:clamp(11px,1.2cqw,16px);color:#785241;background:transparent;padding:.6em .4em;text-align:left;border:0;border-left:3px solid transparent;cursor:pointer}
#resume-nav button[aria-current=true]{color:#633d30;background:#f5dece;border-left-color:#c67e67;border-radius:0 4px 4px 0}
.resume-scroll{overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;scrollbar-color:#cca88e #f9edd9;scrollbar-width:thin;padding:3% 6% 7%;line-height:1.65;font-size:clamp(13px,1.25cqw,19px);outline-offset:-4px}
.resume-identity{display:flex;align-items:center;justify-content:space-between;gap:1em;margin-bottom:1.5em;padding-bottom:1.2em;border-bottom:1px solid #dcbaa1}
.resume-identity h1{margin:0;font-size:clamp(23px,3.4cqw,48px);font-family:"Songti SC","STSong",serif;letter-spacing:.09em;color:#644333}
.resume-identity img{width:clamp(48px,6.5cqw,92px);height:auto;border:4px solid #fffdf4;box-shadow:0 1px 5px #8f654b33;transform:rotate(2deg)}
.resume-identity p{margin:.55em 0 0;font-size:.86em}.resume-identity a{color:#775040;text-decoration-thickness:1px;text-underline-offset:3px}
.resume-scroll section{scroll-margin-top:.6em;margin:0 0 1.7em}
.resume-scroll h2{color:#915948;font-size:1.32em;margin:0 0 .8em;font-family:"Songti SC","STSong",serif}
.resume-scroll h3{font-size:1em;margin:.8em 0 .16em}.resume-scroll p{white-space:pre-line;margin:.2em 0 .65em}.resume-scroll .entry-meta{font-size:.87em;color:#8b624d}
#avatar-chat{--rose:#ad5972;border:1.5px solid #cca189;border-radius:22px;width:min(485px,calc(100vw - 24px));height:min(540px,calc(100dvh - 48px));max-height:92dvh;padding:0;overflow:hidden;color:#5b4033;background:#fff8ee;box-shadow:0 14px 55px #663b3247}
#avatar-chat[open]{display:flex;flex-direction:column}
#avatar-chat::backdrop{background:#503c314a}
.avatar-bar{padding:15px 18px;border-bottom:1px solid #e5c8b8;background:linear-gradient(110deg,#f9d8ce,#fff1df);display:flex;align-items:center;gap:11px}
.avatar-bar img{width:46px;height:46px;object-fit:cover;border:3px solid #fff7e9;border-radius:50%;box-shadow:0 1px 3px #8b654b3b}
.avatar-bar h2{margin:0;font-size:19px}.avatar-bar span{font-size:12px;color:#805e4c}
.close-avatar{margin-left:auto;color:#8d5749;font-size:25px;width:34px;height:34px;line-height:1;border:0;background:#ffefdf;border-radius:50%;cursor:pointer}
.chat-log{min-height:0;flex:1;overflow:auto;display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:18px 16px;overscroll-behavior:contain}
.message{max-width:91%;flex:none;border-radius:14px;padding:10px 13px;white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.65 system-ui,sans-serif}
.message.incoming{background:#f5e8d8;border-bottom-left-radius:4px}.message.outgoing{align-self:flex-end;background:#f8d4dc;border-bottom-right-radius:4px}
.message small{display:block;font-size:11px;color:#805c4c;margin-top:5px}
#chat-form{padding:10px 14px 14px;display:flex;gap:8px;border-top:1px solid #ead6c0}
#chat-input{flex:1;min-width:0;background:#fffcf6;border:1px solid #d4b09d;border-radius:12px;padding:10px 11px;font:16px system-ui;color:#513a2d}
#chat-form button{border:0;border-radius:11px;background:#b85f79;color:white;font-weight:600;padding:0 15px;cursor:pointer}
#chat-form button:disabled{opacity:.6;cursor:wait}
@media(max-width:650px) and (orientation:portrait){
 main:has(.stage[data-page=resume]){width:100%}
 .stage[data-page=resume]{aspect-ratio:auto;height:87svh}
 .stage[data-page=resume] #art{object-fit:cover}
 .resume-paper{inset:3% 1.4%}
 .resume-bar{height:54px;padding-left:21%}
 .stage[data-page=resume] #back{top:calc(3% + 27px);left:10%;width:11%;height:39px}
 .resume-body{display:flex;flex-direction:column}
 #resume-nav{flex:none;flex-direction:row;overflow-x:auto;border:0;border-bottom:1px dashed #dfc4ac;padding:4px 7px}
 #resume-nav button{flex:none;font-size:12px;padding:5px 7px}
 .resume-scroll{padding:15px;font-size:15px}
}

#skill-book{
  --grain:url("assets/bc18a79a729281b8ca.png");--ink:#664331;--rose:#a45355;--muted:#886b52;--line:#d3b79a;
  --script:Baskerville,"Palatino Linotype",Georgia,serif;--serif:"Songti SC",STSong,"Noto Serif CJK SC",serif;
  position:absolute;inset:10% 5.3% 10.7%;display:flex;flex-direction:column;padding:.75% .95% 0;
  border:1px solid #ac695d;border-radius:2.7% 3.1% 2.4% 2.8% / 3.6% 4% 4.2% 3.7%;color:var(--ink);
  background:var(--grain),linear-gradient(90deg,#d08f7a,#e7af91 47%,#b97565 50%,#e6a78d 54%,#ce8875);
  box-shadow:0 .34cqw 0 #a96856,0 .7cqw 1.2cqw #67443855;font-family:"PingFang SC",system-ui,sans-serif;isolation:isolate;
}
#skill-book button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
#skill-book button:focus-visible{outline:2px dashed #9c5c48;outline-offset:1px}
#skill-book button:disabled{cursor:default}
.book-spread{position:relative;min-height:0;flex:1;display:grid;grid-template-columns:1fr 1fr;perspective:1700px;touch-action:pan-y}
.book-leaf{position:relative;min-width:0;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#c49b81 #f7ead3}
.left-leaf{border-radius:3% 1.6% 1% 2% / 3% 1.3% .7% 3.5%;background:var(--grain),linear-gradient(90deg,#f8e9d4 0%,#fff6e4 7%,#fff5e5 79%,#f8e8d3 95%,#ddc1a4 100%);box-shadow:inset .25cqw 0 0 #fff8ed,inset .45cqw 0 #e7cdb2}
.right-leaf{border-radius:1.8% 2.7% 2% .9% / 1.5% 3% 3% 1%;background:var(--grain),linear-gradient(90deg,#dbc0a6 0%,#f3dfc8 2.6%,#fff5e3 8%,#fff7e8 79%,#f7e7cd 100%);box-shadow:inset -.22cqw 0 #ead4b6,inset -.4cqw 0 #fff6e3}
.book-script{font:italic 500 clamp(14px,2.05cqw,31px)/1.15 var(--script);color:var(--rose);margin:0}
#skill-book h1,#skill-book h2{font-family:var(--serif);font-weight:700;line-height:1.17;margin:.24em 0;color:var(--ink)}
#skill-book h1{font-size:clamp(25px,4.75cqw,76px);letter-spacing:.055em}
#skill-book h2{font-size:clamp(22px,3.35cqw,53px);letter-spacing:.035em}
.frontispiece{min-height:100%;padding:12% 6% 6%;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}
.cover-photo{width:53%;max-width:290px;aspect-ratio:1.07;margin:6% auto 4.8%;position:relative;padding:2% 2% 4%;transform:rotate(-6deg);background:var(--grain),#fff9e9;border:1px solid #ddbea6;box-shadow:.12cqw .42cqw .65cqw #825c4536}
.cover-photo img{width:100%;height:100%;object-fit:cover;display:block}
.cover-photo::before{content:"";position:absolute;left:33%;top:-5%;width:37%;height:13%;transform:rotate(-3deg);background-color:#eeb1a1;background-image:repeating-linear-gradient(0deg,transparent 0 4px,#fff2df75 4px 8px),repeating-linear-gradient(90deg,transparent 0 4px,#fff2df75 4px 8px);opacity:.9;clip-path:polygon(0 5%,98% 0,96% 25%,100% 49%,96% 65%,100% 98%,0 100%,3% 74%,0 55%,3% 31%)}
.dedication{font:500 clamp(12px,1.4cqw,21px)/1.8 var(--serif);margin:.6em 0 0;color:#745140;letter-spacing:.055em}
.print-book-contents{min-height:100%;padding:13% 11% 12% 13%;display:flex;flex-direction:column;justify-content:center}
.print-book-contents h2{font-size:clamp(28px,4.25cqw,64px);margin:.18em 0 .65em}
.print-chapter-links{display:grid}
.chapter-link{display:flex;align-items:center;gap:5%;width:100%;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;padding:7% 0}
.chapter-link:last-child{border-bottom:1px solid var(--line)}
.chapter-link>span:nth-child(2){display:grid;flex:none;gap:.25em;font:600 clamp(13px,1.95cqw,32px)/1.2 var(--serif)}
.chapter-link small{font:italic 500 clamp(11px,1.18cqw,19px)/1.2 var(--script);color:var(--muted)}
.index-rule{flex:1;align-self:center;border-bottom:1px dotted #c2a387}
.index-no,.skill-index-link small{font:italic 500 clamp(12px,1.45cqw,22px)/1 var(--script);color:#90664e}
.chapter-link:hover,.skill-index-link:hover{color:#9f5252!important;background:#e7b9a221}
.skill-stamp{--print:#996052;--wash:#ebc1b4;position:relative;width:clamp(38px,4.8cqw,76px);aspect-ratio:1;flex:none;display:grid;place-items:center;transform:rotate(-6deg);color:var(--print);
  background:var(--grain),var(--wash);mask:linear-gradient(#000 0 0) center/calc(100% - 7px) calc(100% - 7px) no-repeat,radial-gradient(circle at 50% 50%,#000 60%,transparent 64%) 0 0/8px 8px round}
.skill-stamp::before{content:"";position:absolute;inset:11%;border:1px solid currentColor;opacity:.68}
.skill-stamp svg{display:block;width:49%;height:49%;fill:none;stroke:currentColor;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}
.interests .skill-stamp,#skill-book[data-chapter=interests] .print-skill-card .skill-stamp{--print:#5b7368;--wash:#d4dfc8}
.chapter-index{min-height:100%;padding:16% 8% 8% 12%;display:flex;flex-direction:column;justify-content:center}
.chapter-index h2{margin:.25em 0 .8em!important}
.print-chapter-toggle{background:none;border:0;padding:0;text-align:left;letter-spacing:inherit}
.print-chapter-toggle:disabled{color:var(--ink);opacity:1}
.print-skill-index{display:grid;grid-template-columns:1fr;align-content:start;column-gap:8%}
[data-chapter=interests] .print-skill-index{grid-template-rows:repeat(8,auto);grid-auto-flow:column;grid-template-columns:1fr 1fr}
.skill-index-link{background:transparent;border:0;border-bottom:1px dotted #d8bbaa;display:flex;justify-content:space-between;align-items:center;gap:.3em;text-align:left;padding:.57em .15em;font-size:clamp(11px,1.22cqw,18px)!important}
.skill-index-link[aria-current=page]{color:#944958!important;border-bottom:1px solid #b97d75;background:linear-gradient(90deg,#efc4bb6e,transparent);font-weight:650!important}
.skill-index-link small{font-size:.9em}
.print-skill-card{min-height:100%;padding:11% 11% 10% 13%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.print-skill-card header{margin:6% 0 0}

.print-skill-card .skill-stamp svg{stroke-width:1.28}
.skill-note{font-size:clamp(12px,1.27cqw,19px);line-height:1.85;text-align:left;border-top:1px solid var(--line);padding-top:1em;margin:0}
.print-skill-card figure{width:100%;margin:1em 0}
.print-skill-card figure img,.print-skill-card video{display:block;width:100%;height:auto;max-height:44vh;object-fit:contain;background:#eadbc8}

.book-controls{position:relative;min-height:clamp(28px,4.3cqw,62px);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4.2%;background:var(--grain),#f6e4cd;border-top:1px solid #d4b497;border-radius:0 0 .7cqw .7cqw;box-shadow:0 .13cqw #fff2dc,0 .29cqw #bd9076;margin-bottom:.6%}

.book-controls button:hover:enabled{text-decoration:underline;text-underline-offset:3px}
.book-controls button:disabled{opacity:.4}
.book-controls div{display:flex;gap:.75em;align-items:center}
#book-position{font:italic clamp(12px,1.2cqw,18px)/1 var(--script);color:#7f6049}
.turning-wrap{position:absolute;inset:0;z-index:4;pointer-events:none;perspective:2400px;perspective-origin:46% 40%;clip-path:inset(-1.5% -.65% -1.5% round 1%)}
.turn-underlay{position:absolute;top:0;bottom:0;width:50%;pointer-events:none}
.forward .turn-underlay{left:0}.backward .turn-underlay{left:50%}

// Sample the sheet along its length. Adjacent strips share endpoints and keep
// their arc length as the free edge rolls ahead of the paper at the binding.
function curlGeometry(progress,mesh){
  const {width,count,direction,spine,extra,step,slope}=mesh;
  const t=progress*progress*(3-2*progress);
  const bend=Math.sin(Math.PI*t);
  const base=Math.max(0,Math.PI*t-1.1*bend);
  const tip=Math.min(Math.PI,Math.PI*t+1.22*bend);
  const baseCos=Math.cos(base),baseSin=Math.sin(base);
  let x=spine-direction*extra*baseCos,y=0,z=-extra*baseSin;
  const samples=[];
  for(let i=0;i<count;i++){
    const across=-extra+(i+.5)*step;
    // Oblique strips cross the bottom corner first. The narrow band against
    // the binding has constant tangent, keeping both ends of the spine fixed.
    const u=Math.max(0,Math.min(1,(across-extra)/width));
    const angle=base+(tip-base)*u;
    const cosine=Math.cos(angle),sine=Math.sin(angle);
    const dx=direction*step*cosine,dz=step*sine,dy=-step*bend*.05*u;
    const left=direction>0?[x,y,z]:[x+dx,y+dy,z+dz];
    const normal=direction*sine;
    const matrix=[cosine,direction*dy/step,normal,0,-direction*slope*baseCos,1,-slope*baseSin,0,-normal,0,cosine,0,...left,1];
    const shade=bend*(.025+.34*sine*sine);
    const glint=bend*.47*Math.exp(-Math.pow((angle-1.97)/.37,2));
    samples.push({transform:'matrix3d('+matrix.map(n=>n.toFixed(5)).join(',')+')',shade,glint});
    x+=dx;y+=dy;z+=dz;
  }
  return {samples,edge:x-direction*extra*Math.cos(tip),lift:z-extra*Math.sin(tip),bend};
}
function paperSide(source,back,offset,slant,height){

  const print=source.cloneNode(true);print.classList.add('curl-print');
  const top=-offset-slant*height/2,bottom=top+slant*height;
  print.style.left=top+'px';print.style.transform='skewX('+Math.atan(slant)+'rad)';
  const ink=document.createElement('i');ink.className='curl-ink';
  const right=x=>'calc(var(--sheet-width) + '+x+'px)';
  ink.style.clipPath='polygon('+top+'px 0,'+right(top)+' 0,'+right(bottom)+' 100%,'+bottom+'px 100%)';
  face.append(print,ink);return {face,ink};
}

      face.ink.animate(lighting,options);
    }
  }
  const finish=shadow.animate(frames.map(f=>{
    const spread=.18+f.bend*.84;
    const center=f.edge+direction*f.lift*.15;
    return {transform:'translateX('+center+'px) scaleX('+spread+')',opacity:f.bend*.47};
  }),options);
  finish.onfinish=()=>{wrapper.remove();if(turningLeaf===wrapper)turningLeaf=null};
}
function turnBook(index,animate){
  if(index<0||index>=skillPages.length)return;
  const old=bookPage,entry=skillPages[index];
  const focusInside=skillBook.contains(document.activeElement);
  stopPageTurn();
  const flipping=animate&&index!==old;
  const forward=index>old;
  const animated=flipping&&!reduced.matches&&typeof bookSpread.animate==='function';
  const front=animated?printLeaf(narrowBook.matches?bookSpread:forward?rightLeaf:leftLeaf):null;
  const stationary=animated&&!narrowBook.matches?printLeaf(forward?leftLeaf:rightLeaf):null;
  bookPage=index;expandedIndex=false;
  skillBook.dataset.chapter=entry?.group.id||'contents';
  frontispiece.hidden=bookContents.hidden=Boolean(entry);
  chapterIndex.hidden=skillCard.hidden=!entry;
  if(entry){showChapter(entry.group);fillSkill(entry.item)}
  else{skillCard.replaceChildren();skillIndex.replaceChildren()}
  leftLeaf.scrollTop=rightLeaf.scrollTop=bookSpread.scrollTop=0;
  bookPrev.disabled=bookHome.disabled=index===0;bookNext.disabled=index===skillPages.length-1;
  skillBook.querySelector('#book-position').textContent=folio(index)+' / '+skillPages.length;
  if(flipping){
    paperSound.currentTime=0;paperSound.play().catch(()=>{});
    if(animated)flipLeaf(forward,front,stationary);
    if(focusInside && (!skillBook.contains(document.activeElement)||document.activeElement===document.body||document.activeElement.disabled||document.activeElement.closest('[hidden]'))){
      (entry?skillCard.querySelector('h2'):bookTitle).focus({preventScroll:true});
    }
  }
}

function knowledgeSections(resume,extra){
  const entries=resume.sections.flatMap(section=>section.entries.map(item=>({
    source:'个人简历 · '+section.title,
    title:item.title||section.title,
    text:[item.meta,item.body].filter(Boolean).join('。')
  })));
  return [...entries,...extra].map((item,index)=>({
    ...item,id:'S'+(index+1),
    // The newer interview leaves these two statistics unconfirmed.
    text:item.text.replace('（全球前 30%）','').replace('，成绩位列全球前30%','').replace('，最高笔记支付转化率达 300%','')
  }));
}
function selectEvidence(items,question,history=[]){
  const aliases=[
    [['实习','intern','营销实习','潮玩','儒意','万达'], '实习经历 小红书 天猫'],
    [['跨境','直播脚本','海外','cross-border','livestream'], '跨境直播赛道 双语直播脚本'],
    [['内容运营','增长','marketing','新媒体'], '小红书渠道 天猫渠道 实习经历'],
    [['电商','三创','供应链','ecommerce'], '三创赛 供应链'],
    [['英语','英文','翻译','english','language skills'], '英语课程 专业证书 全英产品发布会'],
    [['学校','学历','教育背景','education','university'], '教育经历 北京交通大学 四川外国语大学'],
    [['管理','团队','领导力','leadership'], '实践经历 部长 队长'],
    [['技能','工具','skill','tools'], '个人技能 办公与内容制作'],
    [['做过哪些项目','介绍你的项目','projects'], '项目经历'],
    [['成绩','绩点','gpa'], '学业成绩'],
    [['介绍自己','自我介绍','about yourself'], '教育经历 实习经历 自我评价']
  ];
  function terms(text){
    const q=text.toLowerCase(),out=new Set(q.match(/[a-z0-9][a-z0-9.+-]+/g)||[]);
    const topic=q.replace(/你为什么|你怎么看|你怎么|你认为|你觉得|为什么|什么样的|如何|你的|你会|什么|哪些|怎样|请问/g,' ');
    for(const run of topic.match(/[\u3400-\u9fff]{2,}/g)||[])for(let i=1;i<run.length;i++)out.add(run.slice(i-1,i+1));
    for(const [patterns,hints] of aliases)if(patterns.some(p=>q.includes(p)))for(const word of hints.split(' '))out.add(word);
    return [...out];
  }
  const focus=terms(question),previous=terms(history.filter(m=>m.role==='user').slice(-1).map(m=>m.content).join(' '));
  const rank=(words,item)=>words.reduce((score,w)=>score+(item.title.toLowerCase().includes(w)?4:0)+(item.source.toLowerCase().includes(w)?2:0)+(item.text.toLowerCase().includes(w)?1:0),0);
  const normalize=text=>text.toLowerCase().replace(/[\s\p{P}]/gu,'');
  const prompt=normalize(question);
  const ranked=items.map(item=>{
    const exact=prompt===normalize(item.title);
    const alias=item.aliases?.some(phrase=>prompt.includes(normalize(phrase)));
    return {item,score:rank(focus,item)+(exact?100:alias?36:0),previous:rank(previous,item)};
  });
  const followUp=/^(那|再|具体|还有|当时|这|它|why|how so|tell me more)/i.test(question.trim());
  return ranked.map(v=>({...v,score:v.score+(followUp ? 0.55 : 0.10)*v.previous})).sort((a,b)=>b.score-a.score);
}

const evidence=knowledgeSections(personalResume,[{"source": "个人认知档案 · 2026-11-25 · 参考回答", "title": "如果不用简历介绍自己，你会怎么介绍？", "text": "我对很多东西感兴趣：金融、语言、审美、时尚、技术和创造。我希望把人生当成一件艺术品去打磨，既能够理解世界，也能够充分体验和表达它。我会在意成就，也在意生活的趣味。我不觉得一个人需要被所学专业或某种风格定义。", "archive": true, "aliases": ["自我介绍", "介绍一下自己", "不用简历"]}, {"source": "个人认知档案 · 2026-11-25 · 参考回答", "title": "你为什么认为专业不是能力的边界？", "text": "我学的是金融，但我也学习翻译、做过市场营销，最近还开始尝试AI创作。不同领域带给我的东西并不完全一样，也可以相互产生联系。专业是你的知识起点，而不是你的能力边界。", "archive": true}, {"source": "个人认知档案 · 2026-11-25 · 参考回答", "title": "为什么消费者愿意为潮玩买单？", "text": "潮玩不仅有商品本身的价值，也可能承载对IP的情感认同、审美偏好及个性表达。我在做内容时逐渐意识到，站在品牌视角介绍产品与站在消费者视角理解产品，是两件不同的事。好的营销需要理解这种差异。", "archive": true}, {"source": "个人认知档案 · 2026-11-25 · 参考回答", "title": "你怎么看流量与商业转化？", "text": "我希望把内容的创意、用户反馈与实际消费行为联系起来看。高浏览和高点赞不能自动等于高成交。内容既需要审美和吸引力，也需要理解用户、产品及商业目标。", "archive": true, "aliases": ["流量和销量", "流量和转化"]}, {"source": "个人认知档案 · 2026-11-25 · 参考回答", "title": "你希望找到什么样的工作？", "text": "我希望找到一份热爱、愿意为之奋斗、有成长性和价值感的事业。工作也是生活的一部分，我不想仅仅把它看作换取生活资源的代价。当然，长期透支身心也不是我想要的。", "archive": true, "aliases": ["理想工作", "什么样的工作"]}, {"source": "个人认知档案 · 2026-11-25 · 参考回答", "title": "AI已经可以翻译了，为什么还要学习外语？", "text": "我认为语言不仅是信息传递的工具，也承载文化和认识世界的方式。AI可以帮助我们跨越很多语言障碍，但亲自学习另一种语言、体验另一种文化所带来的感受，以及人与人之间的理解与共鸣，依然珍贵。", "archive": true, "aliases": ["为什么还要学外语", "ai翻译", "学外语的意义"]}, {"source": "个人认知档案 · 2026-11-25 · 参考回答", "title": "你为什么开始Vibe Coding？", "text": "其实我的动机没那么纯粹。有好奇心、有胜负欲、有时代焦虑，也想克服自己原先对电脑和代码的抵触。看到同学使用AI的实际效果之后，我开始尝试。真正做出作品的时候，我很惊喜，甚至想起小时候热爱阅读、画画和写作的自己。", "archive": true, "aliases": ["为什么使用ai", "为什么开始用ai", "学ai的契机", "vibecoding"]}, {"source": "个人认知档案 · 2026-11-25 · 参考回答", "title": "你认为哪款AI最好？", "text": "我觉得不能脱离需求直接排名。工作流、偏好、使用程度、网络条件和成本，都可能让不同人的实际体验不同。我自己也还在探索。", "archive": true}, {"source": "个人认知档案 · 2026-11-25 · 参考回答", "title": "如果没人看见你的作品，你还会创造吗？", "text": "目前我很难给出一个确定答案。创造本身的快乐与他人的认可对我都很重要，只不过两者的比重可能会随着时间变化。我希望以后能重拾阅读的耐心，重新找回绘画和写作的能力。", "archive": true, "aliases": ["没有观众", "没人看", "别人不认可", "没人认可"]}, {"source": "个人认知档案 · 2026-11-25 · 参考回答", "title": "你如何培养审美？", "text": "我把摄影、P图、剪视频、探店、穿搭、香水以及时尚相关的爱好统称为审美积累。我喜欢观察、体验不同的风格，也希望自己的创作能力能跟得上审美和想法。", "archive": true, "aliases": ["审美积累", "提升审美", "培养审美"]}, {"source": "个人认知档案 · 2026-11-25 · 参考回答", "title": "你认为什么样的人生是好的？", "text": "我想把人生当成一件艺术品去打磨。我想环球旅行，也想找到一份热爱且有价值感的事业。成就与体验我都想要，只是不同阶段会有不同的取舍。", "archive": true, "aliases": ["理想的人生", "好的人生", "人生当成艺术品"]}, {"source": "个人认知档案 · 2026-11-25 · 参考回答", "title": "你怎么看优绩主义？", "text": "我对它的态度比较复杂。我既从中获益，也感受到结果导向对自由阅读、探索和创作空间的挤压。我不想否定过去努力的自己，但也希望未来能给不那么功利的兴趣留出更多空间。", "archive": true}, {"source": "个人认知档案 · 2026-11-25 · 参考回答", "title": "面对无法控制的事情，你怎么做？", "text": "尽人事，听天命，随缘。我愿意尽可能做好能做的事情，也相信随着个人成长、认知与格局扩大，有些困扰会慢慢找到解决方式，或者变得没那么重要。剩下的，就是好好生活，主动发现生活中的美。", "archive": true}, {"source": "个人认知档案 · 2026-11-25 · 参考回答", "title": "你希望成为怎样的人？", "text": "独立、坚韧、自由、可爱、对他人有价值、强大。这些品质与性别无关。", "archive": true}, {"source": "个人认知档案 · 2026-11-25 · 参考回答", "title": "你最大的缺点是什么？", "text": "过于追求完美。哈哈，这确实听起来很像面试标准答案，但也确实是我的真实感受。我对重视的作品有比较高的要求，希望自己的能力跟得上审美和想法。至于一些始终不擅长的领域，我也会接受自己的局限。", "archive": true, "aliases": ["最大的缺点", "最大的短板"]}, {"source": "个人认知档案 · 2026-11-25 · 访谈整理", "title": "金融与跨学科学习", "text": "金融学习带给我的不只是专业知识，更是一种理解复杂问题的方法。我希望弄清楚事情背后的运行逻辑、哪些因素真正影响结果、信息能否支持判断，以及是否存在其他可能性。现实中的很多问题没有标准答案，理解每一种选择背后的代价与可能性，比找到一个看似正确的答案更加重要。\n\n经济学让我尝试理解人为什么做出某种选择，计量经济学提醒我直觉需要数据检验，管理学让我思考个体、组织与商业的关系，语言文化类课程则让我尝试跳出熟悉的语境。我对不同学科之间产生联系的过程很感兴趣。我希望将已有知识迁移到更广阔的场景，但不会把课程经历直接等同于成熟的实务能力。\n\n我并不希望自己的职业可能性被所学专业预先定义。专业是你的知识起点，而不是你的能力边界。", "archive": true}, {"source": "个人认知档案 · 2026-11-25 · 访谈整理", "title": "品牌视角与消费者视角", "text": "站在品牌视角介绍一款产品，与站在消费者视角理解一款产品，是两件很不一样的事情。尤其是潮玩，消费者购买的不只是一个实体商品，还有对某个IP的情感认同、对一种审美的偏爱，甚至是对自我个性和生活态度的表达。\n\n因此，我开始关注不同IP背后的受众特征，思考什么样的选题能够引起共鸣、什么样的视觉表达能够吸引用户，以及如何通过内容建立产品与消费者之间的情感连接。\n\n好的内容不仅需要创意和审美，更需要理解产品、洞察用户，思考如何将用户的注意力、兴趣与情感认同转化为实际消费行为。我也逐渐建立起从内容表现、用户反馈到商业转化的思考习惯，尝试在创意表达与商业目标之间找到平衡。", "archive": true}, {"source": "个人认知档案 · 2026-11-25 · 访谈整理", "title": "跨文化商务沟通与翻译", "text": "语言不只是信息传递的工具。每一种语言背后都有独特的历史、文化、生活经验与认识世界的方式。我喜欢这样一种关于翻译的理解：翻译不是把我讲给你听，而是把我的眼睛借给你，让你看看我所看到的世界。\n\n即使AI可以高效完成大量翻译工作，亲自掌握语言、理解另一种文化所带来的认知体验，以及人与人之间的理解与共鸣，仍然值得珍视。技术能够降低语言障碍，但不必取代人亲身体验另一种文化的过程。\n\n商务英语沟通不只是准确、得体地说英语，还涉及理解对方的文化背景、商业诉求和表达习惯，站在对方立场组织信息、传递价值并寻求共识。金融与翻译的学习为我理解专业信息和跨语言表达提供了基础。", "archive": true}, {"source": "个人认知档案 · 2026-11-25 · 访谈整理", "title": "从抵触电脑到用 AI 创作", "text": "我不是一开始就热爱技术的人。曾经很长时间，我对电脑、代码和复杂AI工具有抵触。直到亲眼看到技术能够解决实际问题，才愿意重新审视自己的判断。我想尝试，不只是因为好奇，也有胜负欲、虚荣心、优绩主义、同辈压力和时代焦虑。我想跟上时代，走出舒适圈，克服曾经不擅长的事情。我不觉得这些动机需要被包装得很纯粹。\n\n真正开始创造之后，原本存在于脑海中的想法变成了具体的作品。这带给我自信，也重新唤起童年阅读、绘画、写作时的快乐。我不认为一种AI工具对所有人都最好。需求、工作流、偏好、雷点、使用程度和网络条件都会影响实际体验。比起仅凭宣传判断，我更愿意使用、比较之后形成自己的评价。", "archive": true}, {"source": "个人认知档案 · 2026-11-25 · 本人原话", "title": "从抵触电脑到用 AI 创作 · 访谈原话", "text": "有好奇心，有正反馈，有胜负欲，有探索欲，有一点我好像想要触及和表达的东西。\n\n我仿佛短暂回到了童年时那个热爱创作，热爱想象的小女孩。", "archive": true}, {"source": "个人认知档案 · 2026-11-25 · 访谈整理", "title": "小时候的写作、阅读与保研经历", "text": "小时候阅读和创作对我来说并不是需要坚持的任务，而是可以让我废寝忘食的事情。后来学习逐渐受到评价标准与目标约束。大学里我想摆脱应试思维，却又进入了保研和优绩主义的体系。我既从中获益，又感受到它对自由探索和创造空间的挤压，因此无法简单地否定它。\n\n互联网为我提供了更多信息，但我也越来越习惯参考别人的路径、复制攻略，追求速度和效率。我开始反思：接收信息、完成任务和真正产生自己的思想，究竟是不是同一件事？\n\n保研结束后，我希望重新把自己养一遍。最近的AI探索让我重新体验到创造的乐趣。我依然会在意成果和认可，但也希望恢复深入阅读的耐心、独立思考的空间，以及不完全以结果为前提的创造欲。", "archive": true}, {"source": "个人认知档案 · 2026-11-25 · 本人原话", "title": "小时候的写作、阅读与保研经历 · 访谈原话", "text": "我努力想跳出高中的应试思维，但由于保研，很大程度上我摆脱不了，我只是又跳入了优绩主义的牢笼，充满功利的，结果导向的，追求速度和效率的。但是，我是优绩主义的既得利益者，我又能说什么呢？\n\n直到大四开学，保研结果出来，我才有机会好好的，重新把自己养一遍。\n\n他人的路径，复刻就好了，他人的攻略，照做就好了，我只顾着应接不暇地学习、完成，我哪里还有创作的激情和思想呢？我都不知道该从何创作起了。我还能创作吗？", "archive": true}, {"source": "个人认知档案 · 2026-11-25 · 访谈整理", "title": "小行李箱带来的创作体验", "text": "我目前无法确定，如果没有观众、认可或实际回报，自己还会创造什么。内在兴趣与外在驱动力兼有，比例可能随时间改变。我不想刻意将动机描述得很纯粹，也不想因此否定创作本身的快乐。我愿意尝试不同的创作形式，不急于为自己设限。最近的小行李箱项目给了我一种久违的温馨、满足与幸福。我希望有机会重新找回阅读、绘画和写作的能力。", "archive": true}, {"source": "个人认知档案 · 2026-11-25 · 访谈整理", "title": "香水、穿搭与不同的审美风格", "text": "我很在意审美。我喜欢摄影、P图、剪视频、逛街、出片、探店、研究穿搭、了解奢侈品、装点朋友圈，也很喜欢香水和时尚相关的事物。这些从小就吸引我。我习惯把这些爱好统称为审美积累。我对气味很敏感，也会对身边很多事物形成自己的审美评价。\n\n我喜欢尝试不同风格，不希望被某一种标签固化。因为对自己重视的作品有较高要求，我也有一些完美主义，希望实现能力能够跟得上审美和想法。除了自己享受创造，我也希望自己的审美与作品可以感染身边的人。", "archive": true}, {"source": "个人认知档案 · 2026-11-25 · 本人原话", "title": "香水、穿搭与不同的审美风格 · 访谈原话", "text": "我把自己这类爱好统称为审美积累。\n\n希望我的能力和创作能跟得上我的审美和想法。\n\n我喜欢尝试不同的风格，不喜欢过于标签化或者固化自己。", "archive": true}, {"source": "个人认知档案 · 2026-11-25 · 访谈整理", "title": "工作、生活和环球旅行", "text": "我认同存在主义，希望通过自己的选择和行动去塑造人生。我的人生梦想是环球旅行，以及找到一份热爱、愿意为之奋斗、具有成长性和价值感的事业。\n\n我不一定非得追求传统意义上的Work-Life Balance。工作也是生命的一部分，我希望工作本身是值得投入的。当然，过于劳累不利于身心健康和长期发展，这也不是我追求的状态。\n\n金钱对我很重要。我有比较明显的消费主义倾向，喜欢吃喝玩乐，是一个非常现充的人。我愿意享受物质和现实生活，不觉得这和精神追求必须对立。成就和体验我都想要，不同阶段可以有不同的优先级。\n\n即使一种人生拥有很高的社会地位、财富和权力，如果伴随着大量束缚和规则，也未必是我愿意选择的人生。我更重视能够自主选择的空间。我希望自己独立、坚韧、自由、可爱、对他人有价值并且强大，这些品质与性别无关。", "archive": true}, {"source": "个人认知档案 · 2026-11-25 · 本人原话", "title": "工作、生活和环球旅行 · 访谈原话", "text": "我算是存在主义的拥趸者。我希望把我的人生当成一个艺术品去打磨。\n\n工作也是生活的一部分，排除工作时间不也是排除了一部分生命吗？\n\n不断取得成就和能够充分体验世界也不冲突吧，我都想要。这个得看阶段性发展。\n\n我希望自己成为独立的、坚韧的、自由的、可爱的、对他人有价值的、强大的人，这不论女性不女性。", "archive": true}, {"source": "个人认知档案 · 2026-11-25 · 访谈整理", "title": "交朋友时看重的品质与“异常值”", "text": "我比较外向，也需要从外部世界获取能量，但对交往对象和环境有自己的偏好。我喜欢有氛围、能够激发兴趣的环境，也喜欢与有思想、有意思、有个人风格、具有外在吸引力的人相处。\n\n我曾经比较慕强，但现在相比于单纯仰望优秀的人，我更关注自己欣赏对方身上的什么品质，以及这些品质是否有可能通过学习和实践成为我的一部分。我也希望尽可能帮助别人，分享经验和思想，拥有能够感染他人的精神力量。\n\n我并不排斥利益交换，认为它是成年社会中正常的关系机制。但实际资源和成长机会并不是吸引力的全部。有时，一个人的外在美、童真的心、活泼可爱的表现，以及他带给我的一些“异常值”，本身就足以让我喜欢和这个人相处。", "archive": true}, {"source": "个人认知档案 · 2026-11-25 · 访谈整理", "title": "面对不确定性：尽人事，听天命", "text": "我愿意尽可能做好自己能够做的事情，但对于结果，我的态度是尽人事、听天命、随缘。有些事情需要等待因果成熟，而不必强行在当下解决。\n\n我认为个人的进步是解决问题的最优解。随着认知变深、视野变广、格局扩大，曾经困扰我的事情也许会变得没有那么重要，或自然找到解决办法。我更愿意将精力投入自身成长，而不是反复纠缠于暂时不可控的问题。\n\n剩下的，就是好好生活，主动发现生活中的美。", "archive": true}, {"source": "个人认知档案 · 2026-11-25 · 本人原话", "title": "面对不确定性：尽人事，听天命 · 访谈原话", "text": "尽人事听天命，随缘。这是我一直以来的想法。背负因果直到因果成熟自动脱落，或者说，个人的进步是解决所有问题的最优解，因为个人的进步可以让我拥有更深更广的认知，更大的格局，这些也就都是小事了，自然迎刃而解。剩下的，就是好好生活，主动发现生活中的美。", "archive": true}, {"source": "个人认知档案 · 2026-11-25 · 访谈整理", "title": "自洽、乐观与完美主义", "text": "过于追求完美的确算我的一个缺点，虽然它听起来很像面试标准答案，哈哈哈哈。我对自己真正重视的作品和事情要求比较高。除此之外，我目前没有觉得自己有太多长期困扰的缺点。\n\n我认为自己比较自洽、乐观，遇事往往会自然地想到积极的一面。偶尔有负面情绪，我觉得非常正常，没有必要始终保持积极。数理不是我的长项，如果实在学不会，那就随它去吧。我没有必要要求自己在所有领域都做到最好。", "archive": true}, {"source": "个人认知档案 · 2026-11-25 · 本人原话", "title": "自洽、乐观与完美主义 · 访谈原话", "text": "我最大的缺点就是过于追求完美，这个笑死我了，因为我之前面试准备的时候真是这么准备的，虽然这的确是真实的。\n\n我算是比较能自洽，乐观，遇事自动脑子里就往好的方面想了。偶尔有负面情绪我觉得都很正常。\n\n像数理这种学不会的短板那就随它去吧。", "archive": true}, {"source": "个人认知档案 · 2026-11-25 · 访谈整理", "title": "小时候喜欢电脑吗？", "text": "小时候我挺喜欢电脑，六岁接触金山打字，七岁就试着在台式电脑上写第一篇短篇小说。本科有一段时间电脑用得少，碰到复杂工具也会抵触。这两段经历都是真的。", "archive": true, "aliases": ["从小就讨厌电脑", "童年用电脑", "第一篇小说"]}, {"source": "个人认知档案 · 2026-11-25 · 访谈整理", "title": "你是专业开发者吗？", "text": "2026 年 11 月这次访谈时，我还是 AI 编程初学者。看到同学用 AI 做小组作业之后，我才慢慢开始尝试更多工具。做出自己的小项目让我很开心，也让我重新找回了小时候创作的感觉。", "archive": true, "aliases": ["专业开发者", "编程水平", "编程基础", "擅长编程", "会写代码", "编程高手"]}, {"source": "个人认知档案 · 2026-11-25 · 访谈整理", "title": "Codex 启动动画是怎么设计的？", "text": "我想让音符、持剑少女的金色轮廓和粒子接连出现，最后进入欢迎幕。我会反复看转场自然不自然、头发有没有被风吹动的感觉，也会听音乐怎么淡出去。这个作品收在小行李箱的 Demo 相册里。", "archive": true, "aliases": ["启动动画", "开场动画"]}, {"source": "个人认知档案 · 2026-11-25 · 访谈整理", "title": "雨夜重庆的创作想法", "text": "我想尝试把重庆的立体城市空间、雨夜的霓虹和音乐节奏放在一起，看看色彩和镜头的紧凑感能不能带出那种氛围。", "archive": true}, {"source": "个人认知档案 · 2026-11-25 · 访谈整理", "title": "实习销售额与个人贡献", "text": "我参与的是内容运营、产品拍摄和推广。按我实习时的记录，运营期间单月商品支付金额最高超过 20 万元。这个数是业务表现，我没有可以单独归到个人名下的销售额。", "archive": true, "aliases": ["个人销售额", "个人创造的", "个人成交额", "实习销售额"]}, {"source": "个人认知档案 · 2026-11-25 · 访谈整理", "title": "CFA 一级成绩与排名", "text": "我一次通过了 CFA 一级考试。关于全球排名，具体统计口径还需要核实。", "archive": true, "aliases": ["全球排名", "cfa排名", "全球前30"]}, {"archive": true, "title": "从 DeepSeek 到 Codex：什么时候开始用 AI？", "aliases": ["什么时候开始用ai", "第一次用ai", "deepseek"], "source": "个人认知档案 · 2026-11-25 · 经历整理", "text": "2025 年除夕，我开始用 DeepSeek，最初拿它聊学业规划、构思论文、做 PPT、写文案。2026 年读研后，我接触了更多工具。10 月看到同学用 AI 做小组作业的效果，我才真的有点心动。后来看到 Vibe Coding 的作品，也想试试用 Codex 把自己的想法做出来。"}, {"archive": true, "title": "本科专业与研究生学习", "aliases": ["什么专业", "教育背景是什么"], "source": "个人认知档案 · 2026-11-25 · 经历整理", "text": "我本科读金融，也修读了翻译交叉专业。2026 年 9 月开始读研。本科接触过经济学、计量经济学、金融工程、管理学、大数据可视化以及语言文化课程，我很喜欢不同学科之间产生联系的过程。"}, {"archive": true, "title": "你是谁？", "aliases": ["你是本人吗", "你是不是本人", "你是不是sadong本人", "是真人吗", "你是ai吗"], "source": "小行李箱 · 分身说明", "text": "你好呀，我是潼潼的 AI 分身。你可以问我她的经历、创作，或者她在访谈里聊过的想法。"}, {"archive": true, "title": "还没有公开记录的话题", "aliases": ["冲突的态度", "团队冲突", "道德困境", "私人访谈", "未公开的访谈"], "source": "个人认知档案 · 2026-11-25 · 公开范围", "text": "这个问题，潼潼目前没有留下可以公开分享的具体回答。"}, {"source": "技能手帐", "title": "专业技能", "text": "英语技能、CFA（特许金融分析师）"}, {"source": "技能手帐 · 专业技能", "title": "英语技能", "text": "潼潼把英语技能列在专业技能中。\n语言学习是我本科期间专业之外的一项重要积累。我通过了英语专业八级、专业四级考试，大学英语六级 552 分、四级 592 分，国才初级获评优秀。同时，我还修读了翻译交叉专业，联络口译与英汉笔译两门课程均取得 92 分。\n\n在学习翻译的过程中，我逐渐意识到，语言从来不只是信息传递的工具。每一种语言背后，都有独特的历史、文化、生活经验与认识世界的方式。我很喜欢这样一种理解：翻译不是把我讲给你听，而是把我的眼睛借给你，让你看看我所看到的世界。即使在 AI 已经能够高效完成大量翻译工作的今天，我依然认为，亲自掌握一门语言、理解另一种文化所带来的认知体验，以及人与人之间真正的理解与共鸣，依然十分珍贵。\n\n这种认识也延伸到了我对商务英语沟通的理解。有效的商务沟通不仅需要准确、得体的语言表达，更需要理解对方的文化背景、商业诉求与思维方式，知道如何站在对方的立场组织信息、传递价值，并在差异中建立共识。金融专业与翻译学习的结合，也让我能够在理解专业信息与商业逻辑的基础上，进行跨语言、跨文化的表达与沟通。\n\n对我而言，语言既是连接人与人的桥梁，也是拓宽认知边界的窗口。它让我有机会接触未经转述的知识、理解不同的观点，并借助另一种语言的眼睛，看到世界原本不曾向我展现的一面。\n英语专业八级\n英语专业四级\n大学英语六级 · 552 分\n大学英语四级 · 592 分\n国才考试初级 · 优秀\n翻译交叉专业修读证书"}, {"source": "技能手帐 · 专业技能", "title": "CFA（特许金融分析师）", "text": "潼潼把CFA（特许金融分析师）列在专业技能中。\n大三的11月18日，通过两个月的紧密备考，我成功通过了CFA一级考试，成绩位列全球前30%。回顾这段历程，我认为自己最大的收获并不只是记住了多少金融知识，更在于逐渐建立起了一套理解复杂问题的方式。面对一个陌生的问题，我习惯先弄清楚它背后的运行逻辑，哪些因素真正决定了结果，现有的信息是否足以支撑我的判断，以及是否存在其他可能性。金融学也让我意识到，现实中很多问题并没有标准答案，比找到一个看似正确的答案更重要的，是理解每一种选择背后的代价与可能性。\n\n本科期间，我接触了经济学、计量经济学、金融工程、管理学、大数据可视化以及跨文化沟通等不同领域的知识。经济学让我试着理解人们为什么做出某种选择，计量经济学让我意识到直觉需要经过数据的检验，管理学让我思考个体、组织与商业之间的关系，而语言和文化类课程则让我学会跳出自己熟悉的语境，从不同角度理解同一件事。我越来越享受不同学科之间产生联系的过程，因为很多有意思的想法，恰恰诞生于原本看似无关的知识之间。\n\n这种好奇心也延伸到了我的专业之外。最近，我开始主动探索 AI、Vibe Coding 等领域，尝试借助 AI 工具完成创意设计与动画项目。我很享受从一个模糊的想法出发，主动寻找知识、选择工具、反复试错，最终让想法变成具体作品的过程。对我而言，技术的吸引力不仅在于它能提高效率，更在于它拓宽了一个人能够探索和创造的边界。\n\n是的，我并不希望自己的职业可能性被所学专业预先定义。我更希望自己成为一个能够连接不同领域知识的人，既能理解商业世界的运行逻辑，也愿意拥抱新的技术与思维方式；既能够理性地分析问题，也保有探索未知、创造新事物的热情。\n\n因为我始终相信，专业是我知识的起点，而不是自己能力的边界。\n2024 年 11 月 · CFA 一级考试通过"}, {"source": "技能手帐", "title": "兴趣技能", "text": "钢琴、主持、爵士舞、瑜伽、游泳、驾车、旅行、摄影、剪辑、写作、阅读、AI 创作、烹饪、咖啡与拉花、调酒"}, {"source": "技能手帐 · 兴趣技能", "title": "钢琴", "text": "潼潼把钢琴列在兴趣技能中。\n5岁时接到的一张钢琴社传单改变了我的兴趣爱好轨迹，妈妈为此买了很多理查德·克莱德曼的钢琴曲集，还有郎朗的传记供我学习，每周一次的钢琴课构成了我童年的回忆。\n五年级的我\n现在的我"}, {"source": "技能手帐 · 兴趣技能", "title": "主持", "text": "潼潼把主持列在兴趣技能中。\n我常常会回忆起在文艺部和伙伴们一起筹备晚会日子。迎新周、学科讲座、元旦晚会、双语晚会、运动会和文化节…… 我们通过节目连接彼此，通过排练加深合作，通过舞台挥展才华，带着团队表达自我、并肩作战、共同成长。每一次站在舞台上，站在观众面前，身体总会自动展现出它最大的潜力，让我越讲越自信，越说越动容，仿佛希望我的声音能传达到每一位观众的心底。\n舞台上的我\n现场主持\n舞台全景\n双人主持"}, {"source": "技能手帐 · 兴趣技能", "title": "爵士舞", "text": "潼潼把爵士舞列在兴趣技能中。"}, {"source": "技能手帐 · 兴趣技能", "title": "瑜伽", "text": "潼潼把瑜伽列在兴趣技能中。"}, {"source": "技能手帐 · 兴趣技能", "title": "游泳", "text": "潼潼把游泳列在兴趣技能中。"}, {"source": "技能手帐 · 兴趣技能", "title": "驾车", "text": "潼潼把驾车列在兴趣技能中。\n我拿到C1驾照啦！科目二和科目三都是满分，一次通过！现在最想做的就是找个周末，带上我的小行李，自己开车出去玩。听说金山岭那边的阿那亚很惬意，不过冬天到了，是不是崇礼会更适合呢？"}, {"source": "技能手帐 · 兴趣技能", "title": "旅行", "text": "潼潼把旅行列在兴趣技能中。"}, {"source": "技能手帐 · 兴趣技能", "title": "摄影", "text": "潼潼把摄影列在兴趣技能中。"}, {"source": "技能手帐 · 兴趣技能", "title": "剪辑", "text": "潼潼把剪辑列在兴趣技能中。\n我的 Vlog"}, {"source": "技能手帐 · 兴趣技能", "title": "写作", "text": "潼潼把写作列在兴趣技能中。"}, {"source": "技能手帐 · 兴趣技能", "title": "阅读", "text": "潼潼把阅读列在兴趣技能中。"}, {"source": "技能手帐 · 兴趣技能", "title": "AI 创作", "text": "潼潼把AI 创作列在兴趣技能中。"}, {"source": "技能手帐 · 兴趣技能", "title": "烹饪", "text": "潼潼把烹饪列在兴趣技能中。\n我的拿手菜有番茄土豆炖牛腩、苹果炖猪排、双椒肉末、辣椒炒肉、水煮肉片、红烧鸡翅、葱烧肥牛、青椒肉丝，还有银耳红枣莲子羹。"}, {"source": "技能手帐 · 兴趣技能", "title": "咖啡与拉花", "text": "潼潼把咖啡与拉花列在兴趣技能中。\n如果来找我喝咖啡，你想点哪一杯？Espresso、美式、拿铁、摩卡我都会做，也会做手冲、冰滴，用摩卡壶煮咖啡。喜欢酸甜口的话，想请你试试我拿手的黑糖话梅美式。喜欢奶咖的话，还有芝士拿铁、Dirty、抹茶拿铁和红茶可可卡布奇诺。每次收杯时，看到丝滑漂亮的拉花是做咖啡最治愈的时刻～\n制作芝士冰拿铁中\n我的拿铁制作全流程\n完美的大白心\n丝滑的千层心"}, {"source": "技能手帐 · 兴趣技能", "title": "调酒", "text": "潼潼把调酒列在兴趣技能中。"}, {"source": "Demo · 作品相册", "title": "三创", "text": "我制作的 PPT。三创赛国赛路演 PPT"}, {"source": "Demo · 评论区手记", "title": "先告诉对方，去哪儿能买到", "text": "看到“哪个网站买啊！急死我了”，我会尽快告诉对方哪天上、在哪儿买。人家问出口的时候，可能就差这一个答案。等久了，想买的劲儿会过去，旁边的人看见问题一直晾着，也可能觉得品牌只顾发帖，或者产品真有什么问题。"}, {"source": "Demo · 评论区手记", "title": "让熊自己报个身高", "text": "自嘲熊会说“俺是14cm的小胖熊”，再配上它自己的表情包。对方也顺着喊它“小胖熊”，这就聊起来啦！换成 emoji，我会回得更抽象、更“发疯”一点。每个 IP 都有自己的说话方式，但谁来问尺寸、材质，我都得给个准话。"}, {"source": "Demo · 评论区手记", "title": "看看这只熊今天去了哪儿", "text": "有人把熊带去朗读亭，还给它戴上了大耳机。我看完照片，回了句“文艺青熊”。我会认真读完留言，也看看照片里有什么。人家给熊安排了这么有意思的一天，当然值得好好接一句呀。"}, {"source": "Demo · 评论区手记", "title": "有人给运营加了个鸡腿", "text": "有位读者专门夸我回评论时配的熊表情包可爱，说要给运营加鸡腿。我又回了一张写着“厚脸皮”的熊。有人问清楚了能放心下单，有人收到熊还想回来晒张图，我都很开心。也希望这点好感能留下来，下次看到我们出别的系列，还愿意点进来逛逛。"}, {"source": "时光网 · emoji", "title": "看我发现了什么干饭神器", "text": "产品视频，趣味餐具演示。截图记录 1.2万 赞、3966 收藏、137 评论。"}, {"source": "时光网 · 自嘲熊", "title": "天呐，可爱的自嘲熊来啦～", "text": "图文，联名官宣。截图记录 2936 赞、466 收藏、410 评论。"}, {"source": "时光网 · 河狸变身计划", "title": "Oh，隔壁工位惊现一只梅宝…", "text": "图文，工位情景拍摄。截图记录 2393 赞、173 收藏、15 评论。"}, {"source": "时光网 · 自嘲熊", "title": "沉浸式拆爆米花自嘲熊毛绒挂件", "text": "产品视频，毛绒挂件开箱。截图记录 2179 赞、194 收藏、49 评论。"}, {"source": "时光网 · 河狸变身计划", "title": "妈妈狸生是旷野啊", "text": "图文，梅宝春游外拍。截图记录 1939 赞、68 收藏、30 评论。"}, {"source": "时光网 · 自嘲熊", "title": "预售啦，把可爱的自嘲熊带回家了吗？", "text": "图文，新品预售。截图记录 1822 赞、183 收藏、90 评论。"}, {"source": "时光网 · 小马宝莉", "title": "是谁又被欣欣子宠爱啦？是碧琪！", "text": "图文，碧琪造型桶穿搭。截图记录 1283 赞、82 收藏、93 评论。"}, {"source": "时光网 · 迈克尔杰克逊大电影", "title": "MJ 大电影官方正版周边", "text": "图文，黑金话筒杯产品摄影。截图记录 1062 赞、280 收藏、114 评论。"}, {"source": "时光网 · 河狸变身计划", "title": "是官周，河狸变身计划大集合", "text": "图文，系列周边合影。截图记录 866 赞、143 收藏、31 评论。"}, {"source": "时光网 · 福运座驾", "title": "福运座驾毛绒车钥匙盲盒开箱大放送！", "text": "产品视频，盲盒开箱。截图记录 844 赞、121 收藏、26 评论。"}, {"source": "时光网 · 小马宝莉", "title": "再也不用担心出门带娃弄脏啦！", "text": "图文，随身挂件搭配。截图记录 821 赞、247 收藏、88 评论。"}, {"source": "时光网 · 自嘲熊", "title": "人 想和自嘲熊一起看电影嘛", "text": "图文，影院场景搭配。截图记录 697 赞、106 收藏、29 评论。"}, {"source": "时光网 · 福运座驾", "title": "今天来给我的娃提车了！", "text": "产品视频，玩偶车库情景短片。截图记录 677 赞、336 收藏、3 评论。"}, {"source": "时光网 · 自嘲熊", "title": "想要一个全是自嘲熊返图的评论区！", "text": "图文，评论区返图征集。截图记录 641 赞、61 收藏、159 评论。"}, {"source": "时光网 · 自嘲熊", "title": "今天来拆亚克力自嘲熊挂件！", "text": "产品视频，亚克力挂件演示。截图记录 542 赞、45 收藏、13 评论。"}, {"source": "Demo · 作品相册", "title": "时光网", "text": "我运营的帖子。在儒意电影担任潮玩市场营销实习生期间，我主要负责时光网小红书与天猫平台的内容策划及运营，参与了小马宝莉、自嘲熊、福运座驾、河狸变身计划、迈克尔·杰克逊大电影、Emoji 等联名及自研 IP 的营销推广。从前期选题策划、文案撰写、产品摄影与视频制作，到后期用户互动、产品手册制作、线下布展及现场销售，我参与了从内容创作、品牌传播到销售转化的多个环节。\n\n在这个过程中，我逐渐意识到，站在品牌视角介绍一款产品，与站在消费者视角理解一款产品，是两件很不一样的事情。尤其是潮玩，消费者购买的不只是商品本身，还有对 IP 的情感认同、对某种审美的偏爱，以及对自我个性和生活态度的表达。因此，我开始更加关注不同 IP 背后的受众特征，思考怎样的选题能够引起共鸣、怎样的视觉表达能够吸引用户，以及如何通过内容建立产品与消费者之间的情感连接。\n小红书运营方面：产出 6 篇浏览量破万的笔记，单篇最高浏览量达 6.5 万+，篇均浏览量达 4,000+；6 篇笔记点赞量破千，单篇最高获赞 1.2 万，账号累计涨粉 2,000+。笔记点击率由 9.37% 提升至 30.27%，运营期间单月商品支付金额最高突破 20 万元。\n\n天猫运营方面：协助制作 4 张点击率超过 10% 的产品封面，发布多条浏览量突破 10 万的宣发视频，其中单条视频向直播间的引流点击率达 4.04%。\n\n这段经历让我对marketing有了更具体的认识：好的内容不仅需要创意和审美，更需要理解产品与消费者，思考如何将用户的注意力、兴趣与情感认同转化为实际消费行为。我也逐渐养成了结合内容表现、用户反馈与商业转化来审视创意的习惯。对我而言，市场营销的魅力恰恰在于理性与感性的结合——既需要对人的情绪与需求保持敏感，也需要用数据检验自己的判断，在创意表达与商业目标之间找到平衡。"}, {"source": "Demo · 作品相册", "title": "AI 小作品", "text": "我的 AI 小作品。Codex 启动动画"}, {"source": "三创赛国赛路演 PPT", "title": "三创赛国赛路演 PPT", "text": "这份 18 页国赛路演稿围绕砀山梨展开，主题是打造多渠道电商营销助农新模式。第 2 至 5 页介绍项目背景、痛点和商业模式，包括直播引流、社群合作以及线上线下一体化。"}, {"source": "三创赛国赛路演 PPT", "title": "三创赛国赛路演 PPT", "text": "第 8 至 14 页展示内容平台、社群、营销活动、直播和销售数据，并复盘品牌特色、用户需求与内容差异化。第 15 至 17 页提出梨产品加工、梨园研学与线上云游等设想，属于未来展望。"}]);
const chatHistory=[];
const chatAPI=location.protocol==='file:'?'http://127.0.0.1:8764/api/chat':'/api/chat';
let asking=false;
const invitation=document.querySelector('#doll-invitation');
let invitationTimer;
function hideInvitation(){
  clearTimeout(invitationTimer);
  invitation.hidden=true;
}
function showInvitation(){
  hideInvitation();
  invitation.textContent=page==='welcome'?'绕着我转一圈试试？':'Halo! 点点我和我聊天～';
  invitationTimer=setTimeout(()=>{
    invitation.hidden=false;
    invitationTimer=setTimeout(hideInvitation,5000);
  },1500);
}
function openAvatar(){
  if(page!=='menu'||avatarChat.open)return;
  hideInvitation();rest();avatarChat.showModal();chatInput.focus({preventScroll:true});
}
avatarChat.querySelector('.close-avatar').onclick=()=>avatarChat.close();
avatarChat.addEventListener('close',()=>{if(page==='menu')doll.focus({preventScroll:true})});
function bubble(content,outgoing=false){
  const node=textElement('div',content,'message '+(outgoing?'outgoing':'incoming'));chatLog.append(node);
  chatLog.scrollTop=chatLog.scrollHeight;return node;
}
function referencePreview(question,history){
  const matches=selectEvidence(evidence,question,history).filter(v=>v.score>=2).slice(0,2);
  if(!matches.length)return {answer:'这个问题，我还没有留下可以分享的回答。',sources:[]};
  const best=matches[0].item;
  if(best.archive)return {answer:best.text,sources:[best.source]};
  return {answer:matches.map(({item})=>(item.title?'【'+item.title+'】\n':'')+item.text).join('\n\n'),sources:[...new Set(matches.map(v=>v.item.source))]};
}
async function askAvatar(question){
  question=question.trim().slice(0,1000);if(asking||!question)return;
  asking=true;chatForm.querySelector('button').disabled=true;chatInput.value='';
  bubble(question,true);const reply=bubble('正在查阅资料…');
  const history=chatHistory.slice(-8);
  let result,cloud=false;
  try{
    if(location.hostname.endsWith('.github.io')) {
      result=referencePreview(question,history);
    } else {
      const response=await fetch(chatAPI,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'omit',
        body:JSON.stringify({question,history}),signal:AbortSignal.timeout(50000)});
      if(!response.ok)throw Error('HTTP '+response.status);
      result=await response.json();
      if(typeof result.answer!=='string'||!result.answer.trim())throw Error('Empty reply');
      cloud=true;
    }
  }catch{
    result=referencePreview(question,history);
  }finally{
    asking=false;chatForm.querySelector('button').disabled=false;
  }
  reply.textContent=result.answer;
  const refs=(result.sources||[]).join('、');
  if(refs||!cloud)reply.append(textElement('small',(cloud?'资料来源':'资料摘录（非 AI 生成）')+(refs?' · '+refs:'')));
  chatHistory.push({role:'user',content:question},{role:'assistant',content:result.answer.slice(0,1500)});
  if(chatHistory.length>12)chatHistory.splice(0,chatHistory.length-12);
  chatLog.scrollTop=chatLog.scrollHeight;
  if(avatarChat.open&&matchMedia('(pointer:fine)').matches)chatInput.focus({preventScroll:true});
}
chatForm.onsubmit=e=>{e.preventDefault();askAvatar(chatInput.value)};

const audioPlayer=document.querySelector('#player');
const musicBox=document.querySelector('#music-box');
const trackList=document.querySelector('#tracks');
const fileInput=document.querySelector('#audio-file');
const statusLine=document.querySelector('#music-message');
const tracks=[{"id": "corner", "title": "转角", "seconds": 20.921678, "url": "assets/acff52e683b91576b7.m4a"}, {"id": "time-to-love", "title": "Time To Love", "seconds": 28.38, "url": "assets/41fcadb7e10844ce1d.m4a"}, {"id": "you-i", "title": "You(=I)", "seconds": 165.991746, "url": "assets/8b1868648cb3a2bea1.m4a"}];
const trackRows=new Map();
let selected=null,playRequest=0,dbPromise=null;
audioPlayer.volume=.65;
function message(text=''){statusLine.textContent=text;statusLine.hidden=!text}
function alignBox(){
  const r=stage.getBoundingClientRect();
  musicBox.style.setProperty('--box-x',r.x+r.width/2+'px');
  musicBox.style.setProperty('--box-y',r.y+r.height/2+'px');
  musicBox.style.setProperty('--box-width',r.width*.365+'px');
}
new ResizeObserver(alignBox).observe(stage);
function openMusic(){
  hideInvitation();rest();alignBox();
  if(!musicBox.open)musicBox.showModal();
  document.querySelector('#music-close').focus({preventScroll:true});
}
musicKey.onclick=()=>press(musicKey,openMusic);
function closeMusic(){
  musicBox.close();musicKey.focus({preventScroll:true});
}
document.querySelector('#music-close').onclick=closeMusic;
musicBox.addEventListener('cancel',e=>{e.preventDefault();closeMusic()});
function refreshPlayback(){
  const playing=!audioPlayer.paused&&!audioPlayer.ended;
  musicKey.dataset.playing=String(playing);musicKey.title=playing?'正在播放 · '+selected?.title:'音乐盒';
  for(const [track,row] of trackRows){
    const active=track===selected&&playing;
    row.setAttribute('aria-pressed',String(active));row.setAttribute('aria-label',(active?'暂停':'播放')+' '+track.title);
    row.querySelector('.play').textContent=active?'Ⅱ':'▶';
  }
}
async function toggleTrack(track){
  stopStartupRetry();
  const request=++playRequest;message();
  if(selected===track&&!audioPlayer.paused){audioPlayer.pause();return}
  if(selected!==track){selected=track;audioPlayer.src=track.url}
  try {await audioPlayer.play()}catch(e){
    if(request===playRequest&&e.name!=='AbortError')message('这首音频无法播放，请选择其他曲目。');
  }
  refreshPlayback();
}
for(const event of ['playing','pause','ended','error'])audioPlayer.addEventListener(event,refreshPlayback);
function clockTime(seconds){
  return Number.isFinite(seconds)?Math.floor(seconds/60)+':'+String(Math.floor(seconds%60)).padStart(2,'0'):'本地';
}
function addRow(track){
  const row=document.createElement('button');row.type='button';row.className='track-row';
  const glyph=document.createElement('span');glyph.className='play';glyph.setAttribute('aria-hidden','true');
  const name=document.createElement('span');name.className='track-name';name.textContent=track.title;
  const time=document.createElement('span');time.className='track-time';time.textContent=clockTime(track.seconds);
  row.append(glyph,name,time);row.onclick=()=>toggleTrack(track);trackList.append(row);
  trackRows.set(track,row);refreshPlayback();
}
tracks.forEach(addRow);

// Choose only from the bundled three. Keep the same player and selection across page routes.
const startupEvents=new AbortController();
function stopStartupRetry(){startupEvents.abort()}
function startSoundtrack(){
  const initial=tracks[Math.floor(Math.random()*tracks.length)];
  selected=initial;
  audioPlayer.src=initial.url;
  audioPlayer.loop=true;
  const attempt=()=>{
    if(startupEvents.signal.aborted||selected!==initial||document.querySelector('#clip-viewer').open)return;
    audioPlayer.play().then(stopStartupRetry).catch(error=>{
      if(startupEvents.signal.aborted)return;
      if(error.name!=='NotAllowedError'&&error.name!=='AbortError'){
        stopStartupRetry();message('音乐载入失败，请在音乐盒中重新选择。');
      }
    });
  };
  // On browsers requiring activation, call play() inside the trusted gesture itself.
  const unlock=event=>{
    if(!event.isTrusted || event.target.closest?.('.track-row'))return;
    if(event.type==='keydown' && (event.repeat||event.altKey||event.metaKey||event.ctrlKey))return;
    attempt();
  };
  for(const type of ['click','keydown','pointerup']){
    document.addEventListener(type,unlock,{capture:true,signal:startupEvents.signal});
  }
  attempt();
}
startSoundtrack();
function library(){
  if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{
    const open=indexedDB.open('little-suitcase-audio-v1',1);
    open.onupgradeneeded=()=>open.result.createObjectStore('songs',{keyPath:'id'});
    open.onsuccess=()=>resolve(open.result);open.onerror=()=>reject(open.error);
  });
  return dbPromise;
}
async function storeFile(record){
  const db=await library();
  await new Promise((resolve,reject)=>{
    const tx=db.transaction('songs','readwrite');tx.objectStore('songs').put(record);
    tx.oncomplete=resolve;tx.onabort=tx.onerror=()=>reject(tx.error);
  });
}
function addLocal(record){
  if(tracks.some(t=>t.id===record.id))return;
  const track={id:record.id,title:record.name,url:URL.createObjectURL(record.blob)};
  tracks.push(track);addRow(track);
}
async function restoreSongs(){
  try{
    const db=await library();
    const req=db.transaction('songs').objectStore('songs').getAll();
    req.onsuccess=()=>req.result.sort((a,b)=>a.added-b.added).forEach(addLocal);
  }catch{/* Browsers without local-file storage still support session imports. */}
}

document.querySelector('#add-track').onclick=()=>fileInput.click();
fileInput.onchange=async()=>{
  const files=Array.from(fileInput.files||[]);fileInput.value='';if(!files.length)return;
  let added=0,sessionOnly=false,invalid=false;
  for(const file of files){
    if(!file.size || (!file.type.startsWith('audio/')&&!/\.(mp3|m4a|aac|wav|ogg|flac)$/i.test(file.name))){invalid=true;continue}
    const id=file.name+'|'+file.size+'|'+file.lastModified;
    if(tracks.some(t=>t.id===id))continue;
    const record={id,name:file.name.replace(/\.[^/.]+$/,''),added:Date.now(),blob:file};
    addLocal(record);added++;
    try{await storeFile(record)}catch{sessionOnly=true}
  }
  if(added)trackList.lastElementChild?.scrollIntoView({block:'nearest'});
  message(invalid?'部分文件不是可添加的音频。':sessionOnly?'已添加，本次打开期间可播放。':added?'已加入歌单。':'这首音乐已经在歌单里了。');
};

const clipViewer=document.querySelector('#clip-viewer'),clipPlayer=document.querySelector('#clip-player');
const clipError=document.querySelector('#clip-error'),clipClose=document.querySelector('#clip-close');
const musicUsesElementVolume=Math.abs(audioPlayer.volume-.65)<.02;
let mixLevel=1,fadeInterval=0,restoreMusic=false,clipWasFullscreen=false;
let musicContext,musicGain;
// iOS versions that reserve element volume for hardware controls can still ramp a Web Audio gain.
function prepareMusicGain(){
  if(musicUsesElementVolume)return;
  try{
    if(!musicContext){
      const AudioAPI=window.AudioContext||window.webkitAudioContext;
      if(!AudioAPI)return;
      musicContext=new AudioAPI();
      musicGain=musicContext.createGain();
      const source=musicContext.createMediaElementSource(audioPlayer);
      source.connect(musicGain);musicGain.connect(musicContext.destination);
    }
    if(musicContext.state!=='running')musicContext.resume().catch(()=>{});
  }catch{musicGain=null}

function setMusicLevel(level){
  mixLevel=level;

function fadeMusic(target,duration,done){

  const from=mixLevel,start=performance.now();
  function step(){
    const elapsed=Math.min(1,(performance.now()-start)/duration);
    const smooth=elapsed*elapsed*(3-2*elapsed);
    setMusicLevel(from+(target-from)*smooth);
    if(elapsed===1){clearInterval(fadeInterval);done?.()}
  }
  fadeInterval=setInterval(step,20);step();
}
function openVideo(asset,title){

const mediaURLs=new WeakMap();
function mediaURL(asset){
  if (!asset.src.startsWith('data:')) return asset.src;
  if(mediaURLs.has(asset))return mediaURLs.get(asset);
  const comma=asset.src.indexOf(',');
  const type=asset.src.slice(5,asset.src.indexOf(';'));
  const text=atob(asset.src.slice(comma+1));
  const bytes=new Uint8Array(text.length);
  for(let i=0;i<text.length;i++)bytes[i]=text.charCodeAt(i);

const stillViewer=document.querySelector('#still-viewer'),stillImage=document.querySelector('#still-image');

const stillCanvas=document.querySelector('#still-canvas'),stillZoom=document.querySelector('#still-zoom');
let photoGallery=null, photoMotion=null;
function clearPhotoMotion(){

  photoMotion.onfinish=null;
  photoMotion.cancel();
  photoMotion=null;
  stillViewer.querySelector('.moving-photo')?.remove();
  stillViewer.classList.remove('photo-flight');
}
function animatePhoto(returning){
  if(!photoGallery||reduced.matches||!stillImage.animate)return false;
  const thumbnail=[...photoGallery.querySelectorAll('.photo-tile img')].find(img=>img.src===stillImage.src);
  if(!thumbnail||!stillImage.naturalWidth)return false;
  if(returning)thumbnail.scrollIntoView({block:'nearest',inline:'nearest',behavior:'instant'});
  const small=thumbnail.getBoundingClientRect(),large=stillImage.getBoundingClientRect();
  if(!small.width||!small.height||!large.width||!large.height)return false;

  copy.className='moving-photo';copy.alt='';copy.src=stillImage.src;
  Object.assign(copy.style,{left:large.left+'px',top:large.top+'px',width:large.width+'px',height:large.height+'px'});
  stillViewer.append(copy);
  stillViewer.classList.add('photo-flight');
  const frames=[{transform:`translate(${small.x-large.x}px,${small.y-large.y}px) scale(${small.width/large.width},${small.height/large.height})`},{transform:'none'}];

stillClose.onclick=dismissStill;
stillViewer.addEventListener('cancel',event=>{event.preventDefault();dismissStill()});

const albumHeading=document.querySelector('#album-heading'),albumIndex=document.querySelector('#album-index');
const albumDetail=document.querySelector('#album-detail'),albumHome=document.querySelector('#album-home');
let albumNumber=-1;
const designs={
  slides:'<rect x="13" y="12" width="54" height="36" rx="3"/><path d="M9 11h62M40 49v7m0 0-12 8m12-8 12 8M23 35l7-7 6 4 10-11m4 14h8m-8 5h8"/>',
  posts:'<path d="M18 12h43v42a5 5 0 0 1-5 5H22a4 4 0 0 1-4-4z"/><path d="M61 20h6v33q0 6-7 6M26 21h25m-6 9h8m-8 6h8m-28 10h28m-28 6h20"/><rect x="25" y="28" width="13" height="11" rx="1"/>',
  ai:'<path d="M37 9c2 14 6 19 19 23-13 4-17 9-19 23-3-14-7-19-20-23 13-4 17-9 20-23Z"/><path d="M59 8c1 5 3 7 8 9-5 1-7 4-8 9-2-5-4-8-9-9 5-2 7-4 9-9ZM56 42l2 7 7 3-7 3-2 7-3-7-7-3 7-3Z"/>'
};
function albumCover(album){
  const cover=document.createElement('span');cover.className='album-cover cover-'+album.id;
  const svg=document.createElementNS(svgNamespace,'svg');
  svg.setAttribute('viewBox','0 0 80 72');svg.setAttribute('aria-hidden','true');
  svg.innerHTML=designs[album.icon];cover.append(svg);return cover;
}
for(const [index,album] of albums.entries()){
  const button=document.createElement('button');button.type='button';button.className='album-button';
  button.append(albumCover(album),textElement('strong',album.category));
  button.onclick=()=>showAlbum(index,true);albumIndex.append(button);
}
function showAlbum(index,focus){
  const previous=albumNumber;albumNumber=index;
  const album=albums[index];
  albumIndex.hidden=Boolean(album);albumDetail.hidden=!album;albumHome.disabled=!album;
  albumHeading.textContent=album?album.category:'作品相册';
  albumDetail.replaceChildren();
  if(album){
    if(album.posts)albumDetail.append(postAlbum(album));
    else if(album.media.length)for(const asset of album.media)albumDetail.append(mediaFigure(asset,album.title));
    else{
      const slip=document.createElement('div');slip.className='album-slip';
      slip.append(albumCover(album),textElement('p',album.empty));albumDetail.append(slip);
    }
  }
  sceneSection.querySelector('.camera-screen').scrollTop=0;
  if(focus)(album?albumHeading:albumIndex.children[Math.max(previous,0)]).focus({preventScroll:true});
}
albumHome.onclick=()=>showAlbum(-1,true);
document.querySelector('#album-prev').onclick=()=>showAlbum(albumNumber<0?albums.length-1:(albumNumber+albums.length-1)%albums.length,true);
document.querySelector('#album-next').onclick=()=>showAlbum((albumNumber+1)%albums.length,true);

function postFilter(label, options) {
  const field = document.createElement('label');
  field.append(textElement('span', label));
  const select = document.createElement('select');
  for (const [value, name] of options) select.add(new Option(name, value));
  field.append(select);
  return {field, select};
}

function postCard(post) {
  const card = document.createElement('button');
  card.type = 'button';
  card.className = 'post-card';
  card.setAttribute('aria-label', '查看' + post.format + '截图 · ' + post.title);
  const cover = document.createElement('img');
  cover.loading = 'lazy';
  cover.src = mediaURL(post.screenshots[0]);
  cover.alt = '';
  if (post.ip === '福运座驾') cover.style.objectPosition = 'center 47%';
  const title = textElement('strong', post.title);
  const project = textElement('span', post.ip + ' · ' + post.angle, 'post-byline');
  const metrics = textElement('span', (post.likesLabel || post.likes) + ' 赞', 'post-metrics');
  metrics.append(textElement('span', post.saves + ' 收藏 · ' + post.comments + ' 评论'));
  card.append(cover, project, title, metrics);
  card.onclick = () => openStills(post.screenshots, 0, post.title);
  return card;
}

function postAlbum(album) {
  const section = document.createElement('section');
  section.className = 'post-album';
  const posts = [...album.posts].sort((a, b) => b.likes - a.likes);
  const overview = document.createElement('div');
  overview.className = 'post-overview';
  for (const paragraph of [album.intro, album.resumeResult].join('\n\n').split('\n\n')) {
    const line = document.createElement('p');
    for (const [index, part] of paragraph.split('**').entries()) {
      line.append(index % 2 ? textElement('strong', part) : part);
    }
    overview.append(line);
  }
  const projects = [...new Set(posts.map(post => post.ip))];
  const ip = postFilter('项目', [['', '全部 IP'], ...projects.map(name => [name, name])]);
  const tiers = [
    {value: 'all', name: '全部点赞', min: 0, max: Infinity},
    {value: '10000', name: '1 万赞及以上', min: 10000, max: Infinity},
    {value: '1000', name: '1000–9999 赞', min: 1000, max: 10000},
    {value: '0', name: '1000 赞以下', min: 0, max: 1000}
  ];
  const tier = postFilter('点赞', tiers.map(({value, name}) => [value, name]));
  const filters = document.createElement('div');
  filters.className = 'post-filters';
  filters.append(ip.field, tier.field);
  const empty = textElement('p', '这个项目在所选点赞范围内还没有收录的帖子。', 'post-empty');
  empty.setAttribute('role', 'status');
  const grid = document.createElement('div');
  grid.className = 'post-grid';
  function update() {
    const band = tiers.find(band => band.value === tier.select.value);
    const visible = posts.filter(post =>
      (!ip.select.value || post.ip === ip.select.value) &&
      post.likes >= band.min && post.likes < band.max);
    empty.hidden = visible.length > 0;
    grid.replaceChildren(...visible.map(postCard));
  }
  ip.select.onchange = tier.select.onchange = update;
  const works = document.createElement('div');
  works.id = 'post-works';
  works.append(overview, filters, empty, grid);
  if (album.commentJournal) {
    const journal = commentJournal(album.commentJournal);
    const views = document.createElement('div');
    views.className = 'post-views';
    views.setAttribute('role', 'group');
    views.setAttribute('aria-label', '运营作品');
    for (const [label, panel] of [['帖子作品', works], ['评论区手记', journal]]) {
      const button = textElement('button', label);
      button.type = 'button';
      button.setAttribute('aria-controls', panel.id);
      button.setAttribute('aria-pressed', String(panel === works));
      button.onclick = () => {
        works.hidden = panel !== works;
        journal.hidden = panel !== journal;
        for (const view of views.children) view.setAttribute('aria-pressed', String(view === button));
      };
      views.append(button);
    }
    journal.hidden = true;
    section.append(views, works, journal);
  } else {
    section.append(works);
  }
  update();
  return section;
}

function commentJournal({intro, entries}) {
  const journal = document.createElement('section');
  journal.id = 'comment-journal';
  journal.setAttribute('aria-label', '评论区手记');
  journal.append(textElement('p', intro, 'journal-intro'));
  const shots = entries.map(entry => entry.screenshot);
  entries.forEach(({title, body, screenshot}, index) => {
    const example = document.createElement('article');
    example.className = 'journal-entry';
    const note = document.createElement('div');
    note.append(textElement('h2', title), textElement('p', body));
    const preview = previewButton(mediaURL(screenshot), screenshot.alt, '放大对话节选 · ' + screenshot.caption,
      () => openStills(shots, index, '评论区手记'));
    example.append(note, preview);
    journal.append(example);
  });
  return journal;
}

renderPage(false);showPage(readPage(),false);

  .then(([atlas,w,m])=>{sheet=atlas;patches.welcome=w;patches.menu=m;ready=true;stage.dataset.ready='true';
    if(page==='welcome')showInvitation();
  }).catch(()=>{doll.title='动作图暂未载入';});
